<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일본 또갈지도</title>
<meta name="description" content="가보고 좋아서 또 갈지도 모르는 일본의 음식점 · 쇼핑 · 숙소 · 투어를 나만의 팁과 함께 모은 지도.">
<meta property="og:title" content="일본 또갈지도">
<meta property="og:description" content="가보고 좋아서, 또 갈지도 모르는 곳만. 나만의 팁과 함께.">
<meta name="theme-color" content="#ffffff">
<script>
  // 저장해 둔 테마를 첫 그리기 전에 적용 (깜빡임 방지). 없으면 기기 설정을 따름
  try { var t = localStorage.getItem('jt-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23d9412b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="hero">
  <button type="button" class="theme" id="theme" aria-label="다크 모드 전환">
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
  </button>
  <p class="eyebrow">Been there. Going back.</p>
  <h1>일본 또갈지도</h1>
  <p class="lede">가보고 좋아서, 또 갈지도 모르는 곳만. <span id="total"></span></p>
</header>

<div class="searchrow">
  <div class="row">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="이름, 메뉴, 팁 검색" autocomplete="off">
      </label>
      <button class="near" id="near" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5 3.8 10.6c-.5.2-.4.9.1 1l6.3 1.9 1.9 6.3c.1.5.8.6 1 .1z"/></svg>
        <span>내 주변</span>
      </button>
  </div>
</div>

<div class="bar" id="bar">
  <div class="bar-inner">
    <div class="viewseg" id="view">
      <button type="button" data-v="list" class="on">목록</button>
      <button type="button" data-v="map">지도</button>
      <button type="button" data-v="trip">내 여행<b id="tripcount"></b></button>
    </div>
    <div class="seg" id="cities" role="tablist"></div>
  </div>
</div>

<div class="filters">
  <div class="chips" id="areas"></div>
  <div class="chips" id="types"></div>
  <div class="chips tags" id="tags"></div>
</div>

<main>
  <p class="status" id="status" hidden></p>
  <p class="viewhead" id="count"></p>
  <div id="list"></div>
  <div id="trip" hidden></div>
  <div id="map" hidden></div>
</main>

<footer>
  <p id="synced"></p>
  <p>위치 정보는 거리 계산에만 쓰이며 어디에도 저장·전송되지 않습니다.</p>
</footer>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" hidden></div>

<script src="data/places.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
