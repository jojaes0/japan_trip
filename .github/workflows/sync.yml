name: 구글맵 동기화

on:
  schedule:
    - cron: '7,37 * * * *' # 30분마다 (GitHub 예약 실행은 붐비면 몇 시간씩 밀릴 수 있음 — 급하면 Actions 탭에서 Run workflow)
  workflow_dispatch:
  push:
    paths: ['data/lists.json', 'data/areas.json', 'scripts/sync.mjs']

permissions:
  contents: write
  issues: write

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync.mjs
      - name: 새 장소 분류 확인 이슈
        if: hashFiles('sync-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "새 장소 분류 확인 ($(date +%F))" --body-file sync-report.md
          rm sync-report.md
      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.js data/stops-cache.json data/sync.json
          git diff --cached --quiet || (git commit -m "구글맵 리스트 동기화" && git push)
